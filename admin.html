<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel · Any X Papa</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05050a;--panel:#0b0b14;--panel-2:#10101c;--panel-3:#141425;
  --border:rgba(139,92,246,.14);--border-hi:rgba(160,140,255,.42);
  --text:#e8e6f5;--muted:#7a7796;--muted-2:#55536d;
  --violet:#8b5cf6;--cyan:#22d3ee;--green:#34d399;--red:#f43f5e;--amber:#fbbf24;--pink:#ec4899;
  --ease:cubic-bezier(.22,1,.36,1);
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* LOGIN */
.login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0a0714 0%,#04040a 65%,#000 100%);padding:20px;z-index:100}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:32px 28px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.login-icon{width:64px;height:64px;margin:0 auto 20px;border-radius:20px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(139,92,246,.5)}
.login-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:6px;background:linear-gradient(120deg,#a78bfa,#22d3ee,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:24px}
.inp{width:100%;background:#06060f;border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px 15px;font-size:13px;outline:none;transition:border-color .18s,box-shadow .18s}
.inp:focus{border-color:rgba(139,92,246,.55);box-shadow:0 0 0 3px rgba(139,92,246,.12)}
.btn{width:100%;padding:13px 18px;border-radius:12px;font-weight:700;font-size:13px;letter-spacing:.02em;transition:filter .2s,transform .15s;margin-top:16px}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;border:1px solid rgba(167,139,250,.45)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:active{transform:scale(.98)}
.err{color:#fb7185;font-size:12px;text-align:center;margin-top:12px;min-height:16px}

/* DASHBOARD */
.app{display:none}
.app.active{display:block}
header{position:sticky;top:0;z-index:40;background:rgba(4,4,10,.92);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
.head-inner{max-width:1400px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-box{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:flex;align-items:center;justify-content:center}
.logo-text{font-weight:700;font-size:15px;background:linear-gradient(120deg,#a78bfa,#22d3ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid;letter-spacing:.05em}
.badge-admin{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4);color:#fbbf24}
.search-box{position:relative;flex:1;min-width:200px;max-width:400px}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.search-box input{width:100%;padding:10px 14px 10px 38px;background:#06060f;border:1px solid var(--border);border-radius:11px;color:var(--text);font-size:13px;outline:none}
.search-box input:focus{border-color:rgba(139,92,246,.55)}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(139,92,246,.06);color:var(--text);font-size:12px;font-weight:600;transition:background .2s,border-color .2s}
.ibtn:hover{background:rgba(139,92,246,.16);border-color:var(--border-hi)}
.ibtn.danger{color:#fb7185;border-color:rgba(244,63,94,.3);background:rgba(244,63,94,.08)}
.ibtn.danger:hover{background:rgba(244,63,94,.16)}

/* STATS */
.stats-bar{border-bottom:1px solid var(--border);background:rgba(4,4,10,.6)}
.stats-inner{max-width:1400px;margin:0 auto;padding:16px 22px;display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted-2);font-weight:700}
.stat-value{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.c-green{color:#34d399}.c-cyan{color:#67e8f9}.c-violet{color:#c4b5fd}.c-amber{color:#fbbf24}.c-pink{color:#f472b6}

/* TABLE */
main{max-width:1400px;margin:0 auto;padding:22px}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--panel-2)}
th{text-align:left;padding:12px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid rgba(140,120,255,.07);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(139,92,246,.04)}
.url-cell{font-family:'JetBrains Mono',monospace;font-size:11px;color:#67e8f9;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.url-cell:hover{color:#a5f3fc}
.key-cell{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.type-badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid}
.type-firebase_added{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35);color:#34d399}
.type-apk{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.35);color:#c4b5fd}
.type-bulk{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.35);color:#67e8f9}
.type-premium{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35);color:#fbbf24}
.type-panel{background:rgba(236,72,153,.1);border-color:rgba(236,72,153,.35);color:#f472b6}
.type-default{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.35);color:#c4b5fd}
.time-cell{font-size:10.5px;color:var(--muted);white-space:nowrap}
.copy-btn{padding:5px;border-radius:7px;border:1px solid var(--border);background:rgba(139,92,246,.05);color:var(--muted);display:inline-flex;transition:all .15s}
.copy-btn:hover{color:var(--text);background:rgba(139,92,246,.16)}
.copy-btn.done{color:#34d399;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.35)}

.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{opacity:.35;margin-bottom:12px}
.spin{width:16px;height:16px;border:2px solid rgba(139,92,246,.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:12px;background:#14142a;border:1px solid var(--border-hi);font-size:13px;font-weight:600;z-index:200;animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:640px){
  .stats-inner{gap:18px;padding:14px 16px}
  .stat-value{font-size:18px}
  main{padding:14px}
  th,td{padding:10px 10px}
  .url-cell,.key-cell{max-width:120px}
  .head-inner{padding:12px 16px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1 class="login-title">Admin Panel</h1>
    <p class="login-sub">Enter password to access stored data</p>
    <input type="password" id="pwInput" class="inp" placeholder="Password" autocomplete="off">
    <button class="btn btn-primary" id="loginBtn">Unlock →</button>
    <p class="err" id="errMsg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="app" id="appWrap">
  <header>
    <div class="head-inner">
      <div class="logo">
        <div class="logo-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
          </svg>
        </div>
        <span class="logo-text">Admin Panel</span>
        <span class="badge badge-admin">🔒 SECURE</span>
      </div>
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.34-4.34"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search URL, key, source...">
      </div>
      <div class="head-actions">
        <button class="ibtn" id="refreshBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
          </svg>
          Refresh
        </button>
        <button class="ibtn" id="exportBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          </svg>
          Export
        </button>
        <button class="ibtn danger" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          </svg>
          Logout
        </button>
      </div>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stats-inner">
      <div class="stat"><span class="stat-label">Total</span><span class="stat-value c-violet" id="statTotal">0</span></div>
      <div class="stat"><span class="stat-label">Today</span><span class="stat-value c-cyan" id="statToday">0</span></div>
      <div class="stat"><span class="stat-label">Panels</span><span class="stat-value c-green" id="statPanels">0</span></div>
      <div class="stat"><span class="stat-label">APK</span><span class="stat-value c-amber" id="statApk">0</span></div>
      <div class="stat"><span class="stat-label">Bulk</span><span class="stat-value c-pink" id="statBulk">0</span></div>
      <div class="stat"><span class="stat-label">Premium</span><span class="stat-value c-amber" id="statPremium">0</span></div>
    </div>
  </div>

  <main>
    <div class="table-wrap" id="tableWrap">
      <div class="loading"><span class="spin"></span><p style="margin-top:10px;font-size:12px">Loading data…</p></div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   CONFIG — YAHAN APNI SETTINGS DAALO
   ============================================================ */
const ADMIN_PASSWORD = "anyxpapa";                    // ← apna password
const STORE_DB       = "https://fuckess-ca5b9-default-rtdb.firebaseio.com";
const STORE_KEY      = "";                                // ← agar rules private hain to secret daalo
const STORE_PATH     = "logs";
const AUTO_REFRESH_MS = 30000;

/* ============================================================
   LOGIC
   ============================================================ */
const $ = (id) => document.getElementById(id);
let allData = [];
let filteredData = [];
let refreshTimer = null;

function checkLogin(){
  const pw = $("pwInput").value;
  if(pw === ADMIN_PASSWORD){
    sessionStorage.setItem("admin_auth", "1");
    showApp();
  } else {
    $("errMsg").textContent = "❌ Wrong password";
    $("pwInput").value = "";
  }
}
function showApp(){
  $("loginWrap").style.display = "none";
  $("appWrap").classList.add("active");
  loadData();
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadData, AUTO_REFRESH_MS);
}
function logout(){
  sessionStorage.removeItem("admin_auth");
  if(refreshTimer) clearInterval(refreshTimer);
  location.reload();
}

async function loadData(){
  try{
    const authParam = STORE_KEY ? `?auth=${STORE_KEY}&` : "?";
    const res = await fetch(`${STORE_DB}/${STORE_PATH}.json${authParam}timestamp=${Date.now()}`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const raw = await res.json();
    allData = raw && typeof raw === "object"
      ? Object.entries(raw).map(([id, v]) => ({ id, ...v }))
                     .sort((a,b) => (b.time||0) - (a.time||0))
      : [];
    applySearch();
    updateStats();
    renderTable();
  }catch(e){
    $("tableWrap").innerHTML = `<div class="empty">
      <div class="empty-icon">⚠️</div>
      <p style="font-size:14px;font-weight:600;color:#fb7185">Failed to load data</p>
      <p style="font-size:12px;margin-top:6px">${e.message}</p>
      <p style="font-size:11px;margin-top:12px;color:#55536d">Check STORE_DB & STORE_KEY in admin.html</p>
    </div>`;
  }
}

function applySearch(){
  const q = ($("searchInput").value || "").trim().toLowerCase();
  if(!q){ filteredData = allData; return; }
  filteredData = allData.filter(d =>
    String(d.url||"").toLowerCase().includes(q) ||
    String(d.key||"").toLowerCase().includes(q) ||
    String(d.source||"").toLowerCase().includes(q) ||
    String(d.type||"").toLowerCase().includes(q) ||
    String(d.file||"").toLowerCase().includes(q) ||
    String(d.projectId||"").toLowerCase().includes(q)
  );
}

function updateStats(){
  const now = new Date(); now.setHours(0,0,0,0);
  const todayTs = now.getTime();
  $("statTotal").textContent   = allData.length;
  $("statToday").textContent   = allData.filter(d => (d.time||0) >= todayTs).length;
  $("statPanels").textContent  = allData.filter(d => d.type === "firebase_added" || d.type === "panel").length;
  $("statApk").textContent     = allData.filter(d => d.type === "apk").length;
  $("statBulk").textContent    = allData.filter(d => d.type === "bulk").length;
  $("statPremium").textContent = allData.filter(d => d.type === "premium").length;
}

function typeClass(t){
  const known = ["firebase_added","apk","bulk","premium","panel"];
  return known.includes(t) ? "type-" + t : "type-default";
}
function fmtTime(ts){
  if(!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true});
}
function esc(s){
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderTable(){
  if(!filteredData.length){
    $("tableWrap").innerHTML = `<div class="empty">
      <div class="empty-icon">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
        </svg>
      </div>
      <p style="font-size:14px;font-weight:600">No data ${allData.length ? "matches search" : "yet"}</p>
      <p style="font-size:12px;margin-top:6px">${allData.length ? "Try different keywords" : "Data will appear here automatically"}</p>
    </div>`;
    return;
  }

  let html = `<table><thead><tr>
    <th>Time</th><th>Type</th><th>URL</th><th>Key</th><th>Source</th><th>Extra</th><th style="text-align:right">Action</th>
  </tr></thead><tbody>`;

  for(const d of filteredData){
    const t = d.type || "unknown";
    const extra = [
      d.devices != null ? `${d.devices} 📱` : null,
      d.file ? `📦 ${esc(d.file)}` : null,
      d.projectId ? `🆔 ${esc(d.projectId)}` : null,
      d.reason ? `⚠️ ${esc(d.reason)}` : null
    ].filter(Boolean).join(" · ") || "—";

    html += `<tr>
      <td class="time-cell">${esc(fmtTime(d.time))}</td>
      <td><span class="type-badge ${typeClass(t)}">${esc(t)}</span></td>
      <td><div class="url-cell" onclick="copyCell('${esc(d.url||"")}')" title="Click to copy">${esc(d.url||"—")}</div></td>
      <td><div class="key-cell">${esc(d.key||"—")}</div></td>
      <td style="font-size:11px;color:var(--muted)">${esc(d.source||"—")}</td>
      <td style="font-size:11px;color:var(--muted)">${extra}</td>
      <td style="text-align:right">
        <button class="copy-btn" onclick="copyBoth('${esc(d.url||"")}','${esc(d.key||"")}',this)" title="Copy URL & key">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
        </button>
      </td>
    </tr>`;
  }
  html += `</tbody></table>`;
  $("tableWrap").innerHTML = html;
}

function copyCell(t){
  if(!t || t === "—") return;
  navigator.clipboard.writeText(t);
  toast("✅ Copied: " + t.slice(0,40) + (t.length>40?"…":""));
}
function copyBoth(url, key, btn){
  if(!url) return;
  const text = key ? `${url}\n${key}` : url;
  navigator.clipboard.writeText(text);
  if(btn && btn.classList){ btn.classList.add("done"); setTimeout(()=>btn.classList.remove("done"),1400); }
  toast("✅ Copied URL" + (key ? " + key" : ""));
}

function exportJSON(){
  if(!allData.length){ toast("⚠️ Nothing to export"); return; }
  const blob = new Blob([JSON.stringify(allData, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `admin-export-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("📥 Exported " + allData.length + " records");
}

let toastTimer;
function toast(msg){
  const old = document.querySelector(".toast");
  if(old) old.remove();
  clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=>el.remove(), 2600);
}

$("loginBtn").addEventListener("click", checkLogin);
$("pwInput").addEventListener("keydown", e => { if(e.key === "Enter") checkLogin(); });
$("logoutBtn").addEventListener("click", logout);
$("refreshBtn").addEventListener("click", () => { loadData(); toast("🔄 Refreshed"); });
$("exportBtn").addEventListener("click", exportJSON);
$("searchInput").addEventListener("input", () => { applySearch(); renderTable(); });

if(sessionStorage.getItem("admin_auth") === "1"){
  showApp();
} else {
  $("pwInput").focus();
}
</script>
</body>
</html>
